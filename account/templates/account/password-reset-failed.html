{% extends 'base.html' %}
{% block body %}
  {% if validlink %}
    <h2>Définir un nouveau mot de passe</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Changer mon mot de passe</button>
    </form>
  {% else %}
    <h2>Lien invalide ou expiré</h2>
    <p>Ce lien de réinitialisation n'est plus valide. Veuillez <a href="{% url 'login_view' %}">retourner à la connexion</a>.</p>
  {% endif %}
{% endblock %}
