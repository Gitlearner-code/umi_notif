{% extends 'base.html' %}
{% block body %}
  {% if validlink %}
  <h2>Définir un nouveau mot de passe</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Changer mon mot de passe</button>
  </form>
{% else %}
  <h2>Lien déjà utilisé ou expiré</h2>
  <p>Ce lien de réinitialisation n'est plus valide. Veuillez en demander un nouveau.</p>
  <a href="{% url 'login_view' %}">Retour à la connexion</a>
{% endif %}

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #01013e;
        padding: 20px;
        display: flex;
        justify-content: center; 
        flex-direction: column;   
        min-height: 100vh;
        align-items: center;
    }
    h2 {
        color: white;
    }
    form {
        background: white;
        padding: 20px;  
        margin-top: 20px;
        border-radius: 25px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    form button {
        padding: 10px 20px;
        background: #01013e;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    a {
        color: #ffcc00;
    }
</style>
{% endblock %}
