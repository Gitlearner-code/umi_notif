{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMI NOTIF</title>
</head>
<body>
    <header class="site-header">
        <a class="site-brand" href="{% url 'home' %}">
            <img
                class="site-logo"
                src="{% static 'images/umi-notif-logo.jpeg' %}"
                alt="Logo BDE"
                width="200"
                height="52"
                decoding="async"
            >
        </a>
        <nav class="site-nav" aria-label="Navigation principale">
            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}">Déconnexion</a>
                <a href="{% url 'notification' %}">Voir les messages</a>
            {% else %}
                <a href="{% url 'login_view' %}">Connexion</a>
            {% endif %}
            <a style="display: none;" href="a-propos.html">À propos</a>
        </nav>
    </header>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
            background-color: #01013e;
            margin: 0;
            padding: 0;
            padding-top: var(--header-h, 64px);
            min-height: 100vh;
            overflow-x: clip;
        }

        .site-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem 1rem;
            background-color: #01013e;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
            z-index: 100;
            color: white;
            padding: 0.65rem clamp(12px, 3vw, 24px);
            position: fixed;
            width: 100%;
            left: 0;
            top: 0;
            box-sizing: border-box;
        }

        .site-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            min-width: 0;
            flex-shrink: 0;
        }

        .site-logo {
            display: block;
            height: clamp(36px, 9vw, 52px);
            width: auto;
            max-width: min(220px, 58vw);
            object-fit: contain;
        }

        .site-nav {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem 1rem;
            margin-left: auto;
        }

        .site-nav a {
            color: rgba(255, 255, 255, 0.95);
            text-decoration: none;
            font-size: clamp(11px, 2.8vw, 13px);
            white-space: nowrap;
            padding: 0.35rem 0;
        }

        .site-nav a:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        @media (max-width: 480px) {
            .site-header {
                flex-direction: column;
                align-items: stretch;
            }

            .site-nav {
                justify-content: center;
                margin-left: 0;
            }
        }
    </style>
    {% block body %}{% endblock %}
</body>
</html>
